<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Prototype Card Game</title>
    <script>
      // GitHub Pages has no SPA fallback: a direct hit on /info returns this page.
      // Rewrite the path into a query string and bounce to the app root, where the
      // snippet in index.html restores it before React Router mounts.
      // pathSegmentsToKeep = 1 because the app is served from /<repo>/.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
